<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app mode-work" id="app">

    <!-- Header -->
    <header class="header">
      <div class="header-logo">
        <span class="logo-icon">&#127813;</span>
        <span class="logo-text">Pomodoro</span>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="Open settings" title="Settings">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06
            a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09
            A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83
            l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09
            A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83
            l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09
            a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83
            l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09
            a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>

    <!-- Mode tabs -->
    <nav class="mode-tabs" role="tablist" aria-label="Timer mode">
      <button class="mode-tab active" role="tab" aria-selected="true" data-mode="work">Work</button>
      <button class="mode-tab" role="tab" aria-selected="false" data-mode="shortBreak">Short Break</button>
      <button class="mode-tab" role="tab" aria-selected="false" data-mode="longBreak">Long Break</button>
    </nav>

    <!-- Progress ring + timer display -->
    <div class="timer-container" id="timerContainer">
      <svg class="progress-ring" viewBox="0 0 300 300" aria-hidden="true">
        <defs>
          <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <!-- Background track -->
        <circle class="ring-track" cx="150" cy="150" r="128"/>
        <!-- Inner shadow ring -->
        <circle class="ring-inner" cx="150" cy="150" r="116"/>
        <!-- Progress arc -->
        <circle class="ring-progress" cx="150" cy="150" r="128" id="progressCircle"/>
        <!-- Dot at tip of progress -->
        <circle class="ring-dot" cx="150" cy="22" r="6" id="progressDot"/>
      </svg>

      <div class="timer-display">
        <span class="time-value" id="timeDisplay" aria-live="polite" aria-atomic="true">25:00</span>
        <span class="time-status" id="timerStatus">Ready</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn btn-ghost" id="resetBtn" aria-label="Reset timer" title="Reset (R)">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 1 0 .49-4.69"/>
        </svg>
        Reset
      </button>

      <button class="btn btn-primary" id="startPauseBtn" aria-label="Start timer" title="Start/Pause (Space)">
        <svg class="btn-icon play-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
          viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <svg class="btn-icon pause-icon hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
          viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
        </svg>
        <span class="btn-label">Start</span>
      </button>

      <button class="btn btn-ghost" id="skipBtn" aria-label="Skip to next session" title="Skip (S)">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 4 15 12 5 20 5 4"/>
          <line x1="19" y1="5" x2="19" y2="19"/>
        </svg>
        Skip
      </button>
    </div>

    <!-- Session counter -->
    <section class="sessions" aria-label="Session progress">
      <p class="sessions-label">Sessions</p>
      <div class="sessions-dots" id="sessionsDots" aria-label="Session progress dots"></div>
      <p class="sessions-count" id="sessionsCount">0 completed</p>
    </section>

  </div><!-- /.app -->


  <!-- =================== SETTINGS PANEL =================== -->
  <div class="settings-overlay" id="settingsOverlay" role="dialog" aria-modal="true" aria-label="Settings">
    <div class="settings-panel">

      <div class="settings-header">
        <h2 class="settings-title">Settings</h2>
        <button class="icon-btn" id="closeSettingsBtn" aria-label="Close settings">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="settings-body">

        <!-- Duration group -->
        <fieldset class="settings-group">
          <legend class="settings-group-title">Time (minutes)</legend>

          <div class="settings-row">
            <label class="settings-row-label" for="workDuration">Work</label>
            <div class="number-input" role="group" aria-label="Work duration">
              <button class="num-btn" data-action="dec" data-target="workDuration" aria-label="Decrease">&#8722;</button>
              <input type="number" id="workDuration" value="25" min="1" max="60" aria-label="Work minutes" />
              <button class="num-btn" data-action="inc" data-target="workDuration" aria-label="Increase">&#43;</button>
            </div>
          </div>

          <div class="settings-row">
            <label class="settings-row-label" for="shortBreakDuration">Short Break</label>
            <div class="number-input" role="group" aria-label="Short break duration">
              <button class="num-btn" data-action="dec" data-target="shortBreakDuration" aria-label="Decrease">&#8722;</button>
              <input type="number" id="shortBreakDuration" value="5" min="1" max="30" aria-label="Short break minutes" />
              <button class="num-btn" data-action="inc" data-target="shortBreakDuration" aria-label="Increase">&#43;</button>
            </div>
          </div>

          <div class="settings-row">
            <label class="settings-row-label" for="longBreakDuration">Long Break</label>
            <div class="number-input" role="group" aria-label="Long break duration">
              <button class="num-btn" data-action="dec" data-target="longBreakDuration" aria-label="Decrease">&#8722;</button>
              <input type="number" id="longBreakDuration" value="15" min="1" max="60" aria-label="Long break minutes" />
              <button class="num-btn" data-action="inc" data-target="longBreakDuration" aria-label="Increase">&#43;</button>
            </div>
          </div>

          <div class="settings-row">
            <label class="settings-row-label" for="longBreakInterval">Long Break Every</label>
            <div class="number-input" role="group" aria-label="Long break interval">
              <button class="num-btn" data-action="dec" data-target="longBreakInterval" aria-label="Decrease">&#8722;</button>
              <input type="number" id="longBreakInterval" value="4" min="2" max="10" aria-label="Sessions before long break" />
              <button class="num-btn" data-action="inc" data-target="longBreakInterval" aria-label="Increase">&#43;</button>
            </div>
          </div>
        </fieldset>

        <!-- Preferences group -->
        <fieldset class="settings-group">
          <legend class="settings-group-title">Preferences</legend>

          <div class="settings-row">
            <label class="settings-row-label" for="autoStartBreaks">Auto-start Breaks</label>
            <label class="toggle" aria-label="Auto-start breaks">
              <input type="checkbox" id="autoStartBreaks" checked />
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
            </label>
          </div>

          <div class="settings-row">
            <label class="settings-row-label" for="autoStartWork">Auto-start Work</label>
            <label class="toggle" aria-label="Auto-start work sessions">
              <input type="checkbox" id="autoStartWork" />
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
            </label>
          </div>

          <div class="settings-row">
            <label class="settings-row-label" for="soundAlert">Sound Alert</label>
            <label class="toggle" aria-label="Sound alert on completion">
              <input type="checkbox" id="soundAlert" checked />
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
            </label>
          </div>
        </fieldset>

      </div><!-- /.settings-body -->

      <div class="settings-footer">
        <button class="btn btn-primary btn-full" id="saveSettingsBtn">Save Changes</button>
      </div>

    </div><!-- /.settings-panel -->
  </div><!-- /.settings-overlay -->

  <script src="app.js"></script>
</body>
</html>
